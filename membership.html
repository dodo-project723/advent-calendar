<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),app=$('#app'),main=$('#main'),sheet=$('#sheet');
const STORAGE='adfree-membership-prototype-v1',PLANS={weekly:{label:'Weekly',price:'$1.99',period:'week'},monthly:{label:'Monthly',price:'$2.99',period:'month'}};
const initial=()=>({plan:'monthly',status:'free',expiry:0,savedScenes:[],pending:null,scene:0,purchaseOutcome:'success',restoreOutcome:'none'});
let state=initial();try{state={...state,...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(_){};
if(!PLANS[state.plan])state.plan='monthly';if(!Array.isArray(state.savedScenes))state.savedScenes=[];if(state.saved&&!state.savedScenes.length)state.savedScenes=[state.scene];delete state.saved;
let selected='monthly',origin='me',busy=false,toastTimer,adTimer,adCallback=null,adKind=null;
const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(_){}};
const date=t=>new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date(t));
const entitled=()=>['active','cancelled','grace'].includes(state.status)&&state.expiry>Date.now();
const getScreen=()=>{const r=location.hash.slice(1);return ['me','home','saved','paywall','membership'].includes(r)?r:'me'};
const toast=text=>{clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2800)};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function setMembership(status,plan=state.plan){state.plan=plan;state.status=status;state.pending=null;const d=new Date();if(plan==='weekly')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1);state.expiry=['free','expired','revoked'].includes(status)?Date.now()-86400000:d.getTime();save()}
function closeSheet(){clearInterval(adTimer);adCallback=null;adKind=null;if(sheet.open)sheet.close()}
function openSheet(html,label){closeSheet();sheet.innerHTML=html;sheet.setAttribute('aria-label',label);sheet.showModal()}
function navigate(screen){closeSheet();if(screen===getScreen()){render();return}history.pushState({},'',`${location.pathname}${location.search}#${screen}`);render();window.scrollTo(0,0)}
function memberEntry(){return entitled()?`<button class="membership-entry" data-action="membership"><span class="entry-kicker">${icon('crown')}AD-FREE MEMBER</span><h2>A little more peace.</h2><p>${PLANS[state.plan].label} membership · ${state.status==='cancelled'?'Ends':state.status==='grace'?'Payment needs attention · Until':'Renews'} ${date(state.expiry)}</p><span class="entry-bottom">Your membership ${icon('arrow')}</span></button>`:`<button class="membership-entry" data-action="membership"><span class="entry-kicker">${icon('crown')}AD-FREE MEMBERSHIP</span><h2>More calm. Less interruption.</h2><p>No interstitial ads. Enjoy rewards<br>without watching ads.</p><span class="entry-bottom">Explore membership ${icon('arrow')}</span></button>`}
function topbar(title,back=false){return `<header class="topbar">${back?`<button class="icon-btn" data-action="back" aria-label="Back">${icon('back')}</button><span style="flex:1;font-size:14px">${title}</span>`:`<h1>${title}</h1>`}<button class="icon-btn" data-action="settings" aria-label="体验设置">${icon('settings')}</button></header>`}
function nav(active){return `<nav class="bottom-nav" aria-label="Main navigation">${[['home','home','Home'],['saved','save','Saved'],['me','user','Me']].map(([r,i,n])=>`<button class="nav-item" data-screen="${r}" ${active===r?'aria-current="page"':''}>${icon(i)}${n}</button>`).join('')}</nav>`}
function row(i,label,action,sub=''){return `<button class="row" data-action="${action}">${icon(i)}<span class="row-label">${label}${sub?`<small>${sub}</small>`:''}</span>${icon('arrow','trailing')}</button>`}
function renderMe(){return `<section class="screen">${topbar('Your space')}<div class="profile"><span class="avatar">${icon('user')}</span><div><h2>Hello, friend.</h2><p>A place for what matters to you.</p></div></div>${memberEntry()}<p class="list-title">PERSONAL</p>${row('save','Saved blessings','saved')}${row('leaf','Reading preferences','preferences')}${row('bell','Notifications','notifications')}<p class="list-title">SUPPORT</p>${row('crown','Restore purchases','restore')}${row('help','Help & support','support')}<div class="quiet-footer"><button class="text-btn" data-action="terms">Terms of Use</button><button class="text-btn" data-action="privacy">Privacy Policy</button></div></section>${nav('me')}`}
const reflections=[['A moment of peace.','May you find a little stillness today,<br>and a little light along the way.'],['Good things take root.','May hope meet you where you are,<br>and grow quietly from there.'],['Let your heart be light.','May the small joys of today<br>stay with you for a little longer.']];
function blessingCard(scene=state.scene){const [title,copy]=reflections[scene%reflections.length];return `<article class="serif-card"><span class="mini-sun" aria-hidden="true"></span><h2>${title}</h2><p>${copy}</p><span class="card-caption">A BLESSING FOR TODAY</span></article>`}
function renderHome(){return `<section class="screen">${topbar('A quiet moment')}<div class="home-welcome"><span class="eyebrow">TODAY, JUST FOR YOU</span><h1 class="page-title">A little light<br>for your day.</h1><p class="body-copy">Take a breath. Keep something beautiful.</p></div>${blessingCard()}<div class="action-stack"><button class="primary" data-action="save-blessing">${icon(state.savedScenes.includes(state.scene)?'check':'save')}${state.savedScenes.includes(state.scene)?'Saved to your blessings':'Save this blessing'}${!entitled()&&!state.savedScenes.includes(state.scene)?'<span class="ad-badge">AD</span>':''}</button><button class="secondary" data-action="next-reflection">Next reflection ${icon('arrow')}</button></div>${entitled()?'<p class="upsell-line">Your membership keeps this space ad-free.</p>':'<p class="upsell-line">A quieter experience awaits. <button data-action="membership">Go ad-free</button></p>'}</section>${nav('home')}`}
function renderSaved(){return `<section class="screen">${topbar('Saved blessings')}${state.savedScenes.length?state.savedScenes.map(n=>blessingCard(n)).join(''):`<div class="saved-empty">${icon('save')}<h2>Keep a little light.</h2><p>Your saved blessings will be here<br>whenever you need them.</p><button class="secondary" data-screen="home" style="margin-top:25px">Find today’s blessing</button></div>`}</section>${nav('saved')}`}
function planCard(key){const p=PLANS[key];return `<button class="plan ${selected===key?'selected':''}" data-plan="${key}" aria-pressed="${selected===key}">${key==='monthly'?'<span class="plan-tag">RECOMMENDED</span>':''}<span class="plan-name">${p.label}<span class="radio"></span></span><span class="price">${p.price}<small>/ ${p.period}</small></span></button>`}
function renderPaywall(){const p=PLANS[selected];return `<section class="screen paywall"><header class="topbar"><button class="icon-btn" data-action="settings" aria-label="体验设置">${icon('settings')}</button><span class="brand-note">A LITTLE MORE PEACE</span><button class="icon-btn" data-action="close-paywall" aria-label="Close membership">${icon('close')}</button></header><div class="premium-mark">${icon('crown')}</div><h1>Enjoy every moment,<br>ad-free.</h1><p class="paywall-lede">Less interruption.<br>More space for the things you love.</p><ul class="benefits"><li><span class="benefit-icon">${icon('shield')}</span>No interstitial ads</li><li><span class="benefit-icon">${icon('gift')}</span>Rewards, without watching ads</li><li><span class="benefit-icon">${icon('leaf')}</span>Membership benefits in activities</li></ul><div class="plans" role="group" aria-label="Subscription plans">${planCard('weekly')}${planCard('monthly')}</div>${state.pending?`<div class="inline-status">${state.pending.kind==='pending'?'Your payment is still pending.':'We’re confirming your membership.'} You won’t need to pay again.</div>`:''}<div class="purchase-area"><button class="primary" data-action="${state.pending?'check-purchase':'subscribe'}" ${busy?'disabled':''}>${busy?'<span class="spinner"></span>':state.pending?'Check payment status':`Subscribe · ${p.price} / ${p.period}`}</button><p class="renewal-copy">Auto-renews at ${p.price} / ${p.period}.<br>Cancel anytime in Google Play.</p></div><div class="quiet-footer"><button class="text-btn" data-action="restore">Restore purchases</button><button class="text-btn" data-action="terms">Terms of Use</button><button class="text-btn" data-action="privacy">Privacy Policy</button></div><button class="continue-free" data-action="close-paywall">Continue for free</button></section>`}
function renderMembership(){const p=PLANS[state.plan],valid=entitled(),ended=['expired','revoked','hold','paused'].includes(state.status);const statusText={active:'Membership active',cancelled:'Active until the end of this period',grace:'Membership active · Payment needs attention',hold:'Membership on hold',paused:'Membership paused',expired:'Membership expired',revoked:'Membership ended',free:'Not subscribed'}[state.status]||'Not subscribed';return `<section class="screen member-center">${topbar('Membership',true)}<span class="eyebrow">YOUR EVERYDAY, UNINTERRUPTED</span><h1 class="page-title">A quieter space.<br>For you.</h1>${valid?`<div class="member-card"><span class="eyebrow">${icon('crown')} AD-FREE MEMBER</span><h2>${p.label} membership</h2><p class="member-price">${p.price} / ${p.period}</p><span class="state-pill"><span class="state-dot"></span>${statusText}</span><p class="member-date">${state.status==='cancelled'?'Your benefits continue until':state.status==='grace'?'Payment recovery period. Benefits stay active through':'Next renewal:'} ${date(state.expiry)}</p></div><ul class="membership-benefits"><li>${icon('check')}No interstitial ads</li><li>${icon('check')}Rewards without watching ads</li><li>${icon('check')}All your membership activity benefits</li></ul>${state.status==='cancelled'?'<p class="notice">Your renewal is canceled. You can keep enjoying all your benefits until this period ends.</p>':state.status==='grace'?'<p class="notice">Please update your payment method in Google Play to keep your membership going.</p>':''}`:`<div class="member-card expiry-card"><h2>${state.pending?'Payment in progress':statusText}</h2><p>${state.pending?'Check the latest payment status or restore your purchase. You won’t be charged again.':ended?'Your saved blessings and activity progress are still here.': 'Choose a plan to enjoy a little more peace.'}</p></div><ul class="membership-benefits"><li>${icon('shield')}No interstitial interruptions</li><li>${icon('gift')}Use rewards without watching ads</li></ul>`}<div class="action-stack">${valid?`<button class="primary" data-action="manage">${state.status==='grace'?'Update payment method':'Manage subscription'}</button>`:state.pending?'<button class="primary" data-action="check-purchase">Check payment status</button>':state.status==='hold'||state.status==='paused'?'<button class="primary" data-action="manage">Manage subscription</button>':'<button class="primary" data-action="resubscribe">Explore plans</button>'}<button class="secondary" data-action="restore">Restore purchases</button></div><p class="body-copy" style="font-size:11px;text-align:center;margin-top:19px">Subscriptions are managed in Google Play.<br>You’re always in control of your renewal.</p></section>`}
function render(){if(['active','cancelled','grace'].includes(state.status)&&state.expiry<=Date.now()){state.status='expired';save()}let screen=getScreen();if(screen==='paywall'&&entitled()){screen='membership';history.replaceState({},'',`${location.pathname}${location.search}#membership`)}app.classList.toggle('is-paywall',screen==='paywall');main.innerHTML=screen==='paywall'?renderPaywall():screen==='membership'?renderMembership():screen==='home'?renderHome():screen==='saved'?renderSaved():renderMe();document.title=screen==='paywall'?'Ad-free Membership':screen==='membership'?'Your Membership':'Your Space · Membership';}
function openMembership(){origin=['me','home','saved'].includes(getScreen())?getScreen():origin;if(entitled()||state.pending||['hold','paused'].includes(state.status))navigate('membership');else{selected='monthly';navigate('paywall')}}
function checkout(){if(busy||state.pending||entitled())return;const p=PLANS[selected];openSheet(`<div class="sheet"><div class="sheet-head"><h2>Google Play</h2><button class="icon-btn" data-action="close-sheet" aria-label="Cancel purchase">${icon('close')}</button></div><span class="demo-note">演示购买 · 不会真实扣费</span><div class="checkout-plan"><div>Ad-free Membership<small>${p.label} subscription</small></div><strong>${p.price}<small>per ${p.period}</small></strong></div><div class="billing-summary">Renews automatically at ${p.price} / ${p.period}. Cancel your subscription anytime in Google Play.</div><button class="primary" data-action="confirm-purchase">Subscribe · ${p.price}</button><button class="continue-free" data-action="close-sheet">Not now</button></div>`,'Google Play purchase preview')}
async function confirmPurchase(){if(busy)return;busy=true;const requestedPlan=selected;sheet.querySelectorAll('button').forEach(b=>b.disabled=true);sheet.querySelector('.primary').innerHTML='<span class="spinner"></span> Processing';await wait(750);closeSheet();const outcome=state.purchaseOutcome;if(outcome==='cancel'){busy=false;render();toast('Purchase canceled');return}if(outcome==='pending'||outcome==='verify_error'){state.pending={plan:requestedPlan,kind:outcome==='pending'?'pending':'confirming'};save();busy=false;navigate('membership');toast(outcome==='pending'?'Payment pending':'Confirming your membership');return}setMembership('active',requestedPlan);busy=false;render();showSuccess('You’re now ad-free.','Your membership is ready. Enjoy a little more peace.')}
function showSuccess(title,description){openSheet(`<div class="sheet" style="padding-top:32px"><div class="premium-mark" style="margin-top:12px;color:#536d43;border-color:#c9d1b9">${icon('check')}</div><h2 style="text-align:center">${title}</h2><p style="text-align:center">${description}</p><div class="action-stack"><button class="primary" data-action="return-origin">Continue</button><button class="text-btn" data-action="show-center">View membership</button></div></div>`,'Membership confirmation')}
async function checkPurchase(){if(busy)return;busy=true;render();await wait(650);if(state.pending&&state.purchaseOutcome==='success'){const plan=state.pending.plan;setMembership('active',plan);busy=false;render();showSuccess('Your membership is ready.','Your benefits are now active.');return}busy=false;render();toast(state.pending?.kind==='pending'?'Payment is still pending. Try again later.':'We couldn’t confirm it yet. Please try again.');}
async function restore(){if(busy)return;if(['me','home','saved'].includes(getScreen()))origin=getScreen();busy=true;openSheet(`<div class="sheet" style="text-align:center;padding-top:45px"><span class="spinner"></span><h2 style="margin-top:25px">Restoring purchases</h2><p>Checking your Google Play purchases…</p></div>`,'Restoring purchases');await wait(850);busy=false;closeSheet();if(state.restoreOutcome==='network'){toast('Couldn’t connect. Please try again.');return}if(state.restoreOutcome==='none'){toast(entitled()?'Your membership is up to date.':'No active subscription found.');return}const plan=state.restoreOutcome==='weekly'?'weekly':'monthly';if(!entitled()||state.plan!==plan)setMembership('active',plan);render();showSuccess('Membership restored.','Your existing benefits are ready to enjoy.')}
function manage(){const p=PLANS[state.plan];const recovering=['grace','hold','paused'].includes(state.status);openSheet(`<div class="sheet"><div class="sheet-head"><h2>Manage subscription</h2><button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('close')}</button></div><span class="demo-note">Google Play 体验 · 仅改变原型状态</span><div class="checkout-plan"><div>Ad-free Membership<small>${p.label} subscription</small></div><strong>${p.price}<small>per ${p.period}</small></strong></div><p>${state.status==='cancelled'?`Your membership ends on ${date(state.expiry)}.`:recovering?'Update your payment details to keep your benefits.':`Your next renewal is ${date(state.expiry)}.`}</p><div class="action-stack"><button class="primary" data-action="${recovering?'recover-payment':state.status==='cancelled'?'resume-renewal':'cancel-renewal'}">${recovering?'Update payment method':state.status==='cancelled'?'Resume renewal':'Cancel renewal'}</button><button class="secondary" data-action="close-sheet">Done</button></div></div>`,'Manage subscription preview')}
function settings(){openSheet(`<div class="sheet"><div class="sheet-head"><h2>体验设置</h2><button class="icon-btn" data-action="close-sheet" aria-label="关闭体验设置">${icon('close')}</button></div><p class="settings-note">仅用于查看原型状态，付款、恢复购买及广告均为模拟。不会修改活动页数据。</p><label class="settings-field">用户身份<select id="preview-role"><option value="free" ${state.status==='free'?'selected':''}>免费用户</option><option value="weekly" ${state.plan==='weekly'&&state.status!=='free'?'selected':''}>周订阅 · $1.99 / 周</option><option value="monthly" ${state.plan==='monthly'&&state.status!=='free'?'selected':''}>月订阅 · $2.99 / 月</option></select></label><label class="settings-field">订阅状态<select id="preview-status">${[['active','有效'],['cancelled','取消续费，当期有效'],['expired','已到期'],['grace','付款宽限期'],['hold','付款冻结'],['paused','暂停已生效'],['revoked','权益撤销']].map(([v,n])=>`<option value="${v}" ${state.status===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="settings-field">购买结果<select id="preview-payment">${[['success','成功'],['cancel','取消'],['pending','付款待处理'],['verify_error','验单网络异常']].map(([v,n])=>`<option value="${v}" ${state.purchaseOutcome===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="settings-field">恢复购买结果<select id="preview-restore">${[['none','无有效订单 / 保持已有权益'],['weekly','恢复周订阅'],['monthly','恢复月订阅'],['network','网络异常']].map(([v,n])=>`<option value="${v}" ${state.restoreOutcome===v?'selected':''}>${n}</option>`).join('')}</select></label><div class="action-stack"><button class="primary" data-action="apply-settings">应用设置</button><button class="secondary" data-action="reset-preview">重置体验</button></div></div>`,'体验设置');}
function applySettings(){const role=$('#preview-role').value,status=$('#preview-status').value;state.purchaseOutcome=$('#preview-payment').value;state.restoreOutcome=$('#preview-restore').value;const sameMembership=(role==='free'&&state.status==='free')||(role!=='free'&&role===state.plan&&status===state.status);if(!sameMembership){if(role==='free'){state.status='free';state.expiry=0;state.pending=null;save()}else setMembership(status,role)}else save();closeSheet();if(getScreen()==='paywall'&&entitled())navigate('membership');else render();toast('体验设置已更新')}
function finishSave(){if(state.savedScenes.includes(state.scene)){toast('Already saved to your blessings.');return}state.savedScenes.push(state.scene);save();render();toast('Saved. A little light, whenever you need it.')}
function nextReflection(){state.scene=(state.scene+1)%reflections.length;save();render();window.scrollTo(0,0)}
function showAd(kind,callback){if(entitled()){callback();return}let remaining=3;adCallback=callback;openSheet(`<div class="ad-scene"><span class="ad-label">AD · SPONSORED</span><button class="icon-btn" data-action="cancel-ad" aria-label="Close advertisement">${icon('close')}</button><div class="ad-orb"></div><h2>A little room<br>to unwind.</h2><p>Make space for a quieter kind of day.</p><button class="primary" id="ad-continue" data-action="complete-ad" ${kind==='rewarded'?'disabled':''}>${kind==='rewarded'?'Continue in 3s':'Continue'}</button></div>`,'Advertisement preview');adCallback=callback;adKind=kind;if(kind==='rewarded'){adTimer=setInterval(()=>{remaining--;const b=$('#ad-continue');if(!b){clearInterval(adTimer);return}b.textContent=remaining>0?`Continue in ${remaining}s`:'Continue';b.disabled=remaining>0;if(remaining<=0)clearInterval(adTimer)},1000)}}
function info(kind){const text={terms:['Terms of Use','Your subscription renews automatically at the selected price and billing interval. Manage or cancel renewal in Google Play. Canceling renewal keeps your benefits until the current paid period ends.'],privacy:['Privacy Policy','This interactive preview stores only its experience settings on this device. It does not collect payment details or create a real subscription.'],preferences:['Reading preferences','Your reading preferences stay the same when you join or leave a membership.'],notifications:['Notifications','You’re in control of your notifications. Membership does not change these settings.'],support:['Here to help','Restore purchases to check an existing subscription. You can manage your subscription and payment method in Google Play.']}[kind];openSheet(`<div class="sheet"><div class="sheet-head"><h2>${text[0]}</h2><button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('close')}</button></div><p>${text[1]}</p><button class="secondary" data-action="close-sheet" style="margin-top:24px">Done</button></div>`,text[0])}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.screen){navigate(b.dataset.screen);return}if(b.dataset.plan){selected=b.dataset.plan;render();return}const action=b.dataset.action;switch(action){case'membership':openMembership();break;case'back':navigate(origin);break;case'close-paywall':navigate(origin);break;case'subscribe':checkout();break;case'confirm-purchase':confirmPurchase();break;case'close-sheet':closeSheet();break;case'return-origin':navigate(origin);break;case'show-center':navigate('membership');break;case'check-purchase':checkPurchase();break;case'restore':restore();break;case'manage':manage();break;case'cancel-renewal':state.status='cancelled';save();closeSheet();render();toast('Renewal canceled. Your benefits stay active.');break;case'resume-renewal':state.status='active';save();closeSheet();render();toast('Renewal resumed.');break;case'recover-payment':setMembership('active');closeSheet();render();toast('Payment updated. Your membership is active.');break;case'resubscribe':selected='monthly';navigate('paywall');break;case'settings':settings();break;case'apply-settings':applySettings();break;case'reset-preview':state=initial();save();selected='monthly';origin='me';closeSheet();navigate('me');toast('体验已重置');break;case'saved':navigate('saved');break;case'save-blessing':if(state.savedScenes.includes(state.scene))finishSave();else if(entitled())finishSave();else if(!b.querySelector('.ad-badge')){render();toast('Membership ended. Please check the updated action.')}else showAd('rewarded',finishSave);break;case'next-reflection':if(entitled())nextReflection();else showAd('interstitial',nextReflection);break;case'cancel-ad':{const cb=adKind==='interstitial'?adCallback:null;closeSheet();if(cb)cb();break}case'complete-ad':{const cb=adCallback;closeSheet();if(cb)cb();break}case'terms':case'privacy':case'preferences':case'notifications':case'support':info(action);break;}});
sheet.addEventListener('cancel',()=>{const cb=adKind==='interstitial'?adCallback:null;clearInterval(adTimer);adCallback=null;adKind=null;if(cb)cb()});
window.addEventListener('popstate',()=>{closeSheet();render()});window.addEventListener('focus',()=>{if(!sheet.open)render()});
setInterval(()=>{if(['active','cancelled','grace'].includes(state.status)&&state.expiry<=Date.now()){state.status='expired';save();if(!sheet.open)render()}},15000);
if(!location.hash){const requested=new URLSearchParams(location.search).get('screen');if(['me','home','paywall','membership','saved'].includes(requested))history.replaceState({},'',`${location.pathname}${location.search}#${requested}`)}render();
})();
</script>
</body></html>
