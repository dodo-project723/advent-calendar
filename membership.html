.paywall-reference .topbar{height:64px;padding:6px 0 0;margin:0 -8px;flex:none}
.paywall-reference .icon-btn{color:#eee;background:#002d3c55;width:40px;height:40px;min-height:40px}
.paywall-reference .restore-top{font-size:12px;color:#e6e8ea;background:transparent;min-height:44px;padding:8px;letter-spacing:.1px}
.app-emblem{position:relative;width:100px;height:100px;margin:12px auto 21px;border-radius:24px;background:radial-gradient(ellipse at 13% 0%,#8b3d0b 0%,transparent 46%),radial-gradient(ellipse at 75% 105%,#143fa6 0%,transparent 47%),#060b13;box-shadow:0 10px 28px #0008,inset 0 0 0 1px #ffffff35,inset 0 0 0 4px #ffffff04;display:grid;place-items:center;flex:none}
.app-emblem img{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit}
.laurel-title{display:flex;justify-content:center;align-items:center;gap:20px;margin:0 auto 27px;flex:none}
.laurel-title h1{font:700 31px/1.12 var(--serif);letter-spacing:-.4px;max-width:240px;margin:0;text-align:center;color:#fff}
.laurel{width:26px;height:74px;color:#d0d0ce;flex:none;opacity:.88}.laurel.right{transform:scaleX(-1)}
.paywall-reference .benefits{gap:17px;margin:0 0 30px;padding:0;flex:none}
.paywall-reference .benefits li{font-size:15px;line-height:1.4;color:#f3f3f3;gap:13px}
.paywall-reference .benefit-icon{width:21px;height:25px;background:none;color:var(--accent)}
.paywall-reference .benefit-icon .icon{height:23px;width:23px;stroke-width:2.4}
.paywall-bottom{margin-top:auto;padding-top:18px}
.paywall-reference .plans{gap:10px}
.paywall-reference .plan{min-height:82px;padding:12px 13px;border-radius:11px;border:1px solid #3b3d40;background:#151719;color:#b7b8bb}
.paywall-reference .plan.selected{border:1.5px solid var(--accent);background:#11221a}
.paywall-reference .plan-name{font-size:12px}.paywall-reference .radio{width:14px;height:14px;border-color:#777}.paywall-reference .selected .radio{border:4px solid var(--accent)}
.paywall-reference .price{font-size:25px;letter-spacing:-.8px;color:#eee;margin-top:9px;font-weight:600;white-space:nowrap}
.paywall-reference .price small{font-size:10px;color:#c0c3c5;font-weight:400;letter-spacing:0;margin-left:1px}
.paywall-reference .selected .price{color:var(--accent)}.paywall-reference .plan-tag{display:none}
.paywall-reference .purchase-area{margin-top:14px}
.paywall-reference .primary{min-height:59px;border-radius:17px;background:linear-gradient(180deg,#cfb18b,#bd9870);box-shadow:inset 0 1px 0 #fff7,0 10px 30px #cba67a20;color:#fff;font:700 25px/1.2 var(--serif);padding:13px}
.paywall-reference .renewal-copy{color:#a6a7ae;font-size:10.5px;line-height:1.5;margin:11px 0 0;letter-spacing:.05px}
.paywall-reference .quiet-footer{gap:12px;margin-top:8px;align-items:center;color:#a4a3ad}
.paywall-reference .text-btn{font-size:11px;text-decoration:none;min-height:36px;padding:6px 0}
.paywall-reference .footer-divider{font-size:11px;color:#575861}
.paywall-reference .preview-footer{position:relative;display:flex;align-items:center;justify-content:center;min-height:35px}
.paywall-reference .continue-free{margin:0;padding:5px 12px;font-size:10px;color:#8f9098;min-height:35px}
.paywall-reference .preview-settings{position:absolute;right:-11px;width:36px;height:36px;min-height:36px;background:transparent;color:#8b8e94}
.paywall-reference .preview-settings .icon{width:17px;height:17px}
.paywall-reference .inline-status{color:#e5e6e3;border-color:#454b44;background:#1c211d}
@media(max-width:540px){.paywall-reference{min-height:100svh;padding:env(safe-area-inset-top) 26px max(12px,env(safe-area-inset-bottom))}.paywall-reference .topbar{height:60px}.app-emblem{width:94px;height:94px;margin-top:7px;margin-bottom:22px}.laurel-title{margin-bottom:26px}.laurel-title h1{font-size:31px}}
@media(max-width:360px){.paywall-reference{padding-left:21px;padding-right:21px}.laurel-title{gap:14px}.laurel-title h1{font-size:28px}.paywall-reference .benefits li{font-size:13px;gap:10px}.paywall-reference .benefits{gap:15px}.paywall-reference .price{font-size:23px}.paywall-reference .plan{padding-left:11px;padding-right:11px}.paywall-reference .primary{font-size:24px}.app-emblem{width:85px;height:85px}.laurel{width:23px;height:65px}}


/* Keep the membership center in the same Lumina dark theme. */
.app.is-member-center{background:#070f19;border-color:#26303b;color:#f4f4f5}
.is-member-center .member-center{background:#070f19}
.is-member-center .topbar .icon-btn{color:#c9ccd0}
.is-member-center .eyebrow{color:#999fa6}
.is-member-center .member-card{background:linear-gradient(120deg,#30271d,#1b202a);border:1px solid #b08a4b4d;color:#fff}
.is-member-center .member-card .eyebrow{color:#e1bd80}
.is-member-center .member-card .member-price,.is-member-center .member-date{color:#c2bcb4}
.is-member-center .membership-benefits li{color:#d2d6dc}
.is-member-center .membership-benefits .icon{color:#45d983}
.is-member-center .member-center .primary{background:#d5b281;color:#19140b}
.is-member-center .member-center .secondary{border-color:#434853;color:#e2e4e7}
.is-member-center .member-center .notice{background:#24261d;color:#cfca9e}
.is-member-center .member-center .body-copy{color:#999fa8}
.is-member-center .expiry-card h2{color:#f0e3c9}
.is-member-center .expiry-card p{color:#b4b8bd}

/* My page based on the supplied Lumina profile screen. */
.app.is-profile{background:#050e17;border-color:#202832;color:#f5f6fa}
.profile-reference{--profile-gold:#ffbf39;--profile-muted:#72757c;position:relative;min-height:844px;background:#050e17;color:#f5f6fa;font-family:Arial,'Helvetica Neue',sans-serif;padding:0 19px 48px}
.profile-reference button{color:inherit;background:none;min-width:0}
.profile-reference .profile-status{height:49px;display:flex;justify-content:space-between;align-items:center;padding:0 15px 0 31px;font-size:16px;font-weight:600;letter-spacing:-.4px}
.profile-reference .status-symbols{display:flex;align-items:center;gap:6px}
.profile-reference .signal{width:17px;height:15px;display:flex;gap:2px;align-items:flex-end}.profile-reference .signal i{display:block;width:3px;background:#f5f6fa;border-radius:1px}.profile-reference .signal i:nth-child(1){height:5px}.profile-reference .signal i:nth-child(2){height:8px}.profile-reference .signal i:nth-child(3){height:11px}.profile-reference .signal i:nth-child(4){height:14px}
.profile-reference .status-wifi{width:17px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.profile-reference .status-battery{width:25px;height:13px;fill:none;stroke:#707680;stroke-width:1}.profile-reference .status-battery .charge{fill:#f4f5f9;stroke:none}
.profile-reference .profile-notifications{height:43px;display:flex;align-items:center;justify-content:flex-end;margin-right:-7px}
.profile-reference .profile-notify{position:relative;width:44px;height:44px;display:grid;place-items:center;padding:0;border-radius:50%}.profile-reference .profile-notify .icon{width:24px;height:24px;stroke-width:1.5}.profile-reference .profile-notify:after{content:'';position:absolute;right:9px;top:10px;width:6px;height:6px;border:1px solid #050e17;border-radius:50%;background:#ff4655}
.profile-reference .profile-person{display:flex;align-items:center;gap:15px;min-height:83px;margin:1px 0 11px}
.profile-reference .profile-art{width:78px;height:78px;flex:none;border:3px solid #e9ede5;border-radius:50%;overflow:hidden;background:#9fbb37}.profile-reference .profile-art svg{display:block;width:100%;height:100%}
.profile-reference .profile-identity{flex:1;min-width:0}.profile-reference .profile-name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.profile-reference .profile-name h1{font-size:22px;line-height:1.2;letter-spacing:-.5px;margin:0;font-weight:600}.profile-reference .profile-age{font-size:12px;color:#c2c6ce;white-space:nowrap}.profile-reference .profile-age b{font-size:16px;color:#00bafa;margin-left:3px;font-weight:500}
.profile-reference .profile-id{display:flex;align-items:center;gap:7px;font-size:11px;line-height:1.5;letter-spacing:.4px;color:#b7bac3;margin:10px 0 0}.profile-reference .profile-id svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.1}
.profile-reference .profile-chevron{width:30px;height:30px;background:#161f28;border-radius:50%;display:grid;place-items:center;flex:none}.profile-reference .profile-chevron .icon{width:15px;height:15px;color:#969ca6}
.profile-reference .profile-stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:8px;margin:13px 2px 24px;font-size:12px;line-height:1.4;white-space:nowrap}.profile-reference .profile-stats strong{font-size:13px;font-weight:500;color:#fff;margin-right:4px}.profile-reference .profile-stats span{color:#71757e}
.profile-reference .profile-membership{width:100%;display:flex;gap:12px;align-items:center;text-align:left;min-height:77px;margin:0 0 17px;padding:15px 15px;border-radius:15px;border:1px solid #9c7c3e70;background:linear-gradient(110deg,#302b20 0%,#1e2225 72%);box-shadow:inset 0 1px 0 #d5b66b14;position:relative;overflow:hidden}
.profile-reference .profile-membership:before{content:'';position:absolute;width:140px;height:140px;right:-65px;top:-78px;border:1px solid #dab56c13;border-radius:50%;box-shadow:0 0 0 23px #dab56c05;pointer-events:none}
.profile-reference .profile-member-icon{height:36px;width:36px;border-radius:10px;display:grid;place-items:center;color:#e9c277;background:#cba65710;flex:none}.profile-reference .profile-member-icon .icon{width:22px;height:22px;stroke-width:1.5}
.profile-reference .profile-member-copy{flex:1;min-width:0}.profile-reference .profile-member-copy strong{font-size:14px;line-height:1.35;color:#f4ddb0;font-weight:600;display:block}.profile-reference .profile-member-copy small{font-size:11px;line-height:1.5;color:#b6ab94;display:block;margin-top:4px}.profile-reference .profile-member-action{display:flex;align-items:center;gap:3px;white-space:nowrap;color:#f1d6a0;font-size:10px;line-height:1.3;flex:none}.profile-reference .profile-member-action .icon{height:12px;width:12px}

<svg class="svg-library" xmlns="http://www.w3.org/2000/svg"><defs>

<div class="app" id="app"><main id="main"></main></div>
<dialog id="sheet" aria-label="Details"></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),app=$('#app'),main=$('#main'),sheet=$('#sheet');
const STORAGE='adfree-membership-prototype-v1',PLANS={weekly:{label:'Weekly',price:'$1.99',period:'week'},monthly:{label:'Monthly',price:'$2.99',period:'month'}};
const initial=()=>({plan:'monthly',status:'free',expiry:0,savedScenes:[],pending:null,scene:0,purchaseOutcome:'success',restoreOutcome:'none'});
let state=initial();try{state={...state,...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(_){};
if(!PLANS[state.plan])state.plan='monthly';if(!Array.isArray(state.savedScenes))state.savedScenes=[];if(state.saved&&!state.savedScenes.length)state.savedScenes=[state.scene];delete state.saved;
let selected='monthly',origin='me',busy=false,toastTimer,adTimer,adCallback=null,adKind=null;
const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(_){}};
const date=t=>new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date(t));
function normalizeMembership(){if(!['free','active','cancelled'].includes(state.status)||(state.status!=='free'&&(!Number.isFinite(Number(state.expiry))||Number(state.expiry)<=Date.now()))){state.status='free';state.expiry=0;return true}if(state.status==='free'&&state.expiry!==0){state.expiry=0;return true}return false}
const entitled=()=>['active','cancelled'].includes(state.status)&&state.expiry>Date.now();
const getScreen=()=>{const r=location.hash.slice(1);return ['me','home','saved','paywall','membership'].includes(r)?r:'me'};
const toast=text=>{clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2800)};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function setMembership(status,plan=state.plan){state.plan=PLANS[plan]?plan:'monthly';state.status=['active','cancelled'].includes(status)?status:'free';state.pending=null;const d=new Date();if(state.plan==='weekly')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1);state.expiry=state.status==='free'?0:d.getTime();save()}
function closeSheet(){clearInterval(adTimer);adCallback=null;adKind=null;if(sheet.open)sheet.close()}
function openSheet(html,label){closeSheet();sheet.innerHTML=html;sheet.setAttribute('aria-label',label);sheet.showModal()}
function navigate(screen){closeSheet();if(screen===getScreen()){render();return}history.pushState({},'',`${location.pathname}${location.search}#${screen}`);render();window.scrollTo(0,0)}
function memberEntry(){return entitled()?`<button class="membership-entry" data-action="membership"><span class="entry-kicker">${icon('crown')}AD-FREE MEMBER</span><h2>A little more peace.</h2><p>${PLANS[state.plan].label} membership · ${state.status==='cancelled'?'Ends':'Renews'} ${date(state.expiry)}</p><span class="entry-bottom">Your membership ${icon('arrow')}</span></button>`:`<button class="membership-entry" data-action="membership"><span class="entry-kicker">${icon('crown')}AD-FREE MEMBERSHIP</span><h2>More calm. Less interruption.</h2><p>No interstitial ads. Enjoy rewards<br>without watching ads.</p><span class="entry-bottom">Explore membership ${icon('arrow')}</span></button>`}
function topbar(title,back=false){return `<header class="topbar">${back?`<button class="icon-btn" data-action="back" aria-label="Back">${icon('back')}</button><span style="flex:1;font-size:14px">${title}</span>`:`<h1>${title}</h1>`}<button class="icon-btn" data-action="settings" aria-label="体验设置">${icon('settings')}</button></header>`}
function nav(active){return `<nav class="bottom-nav" aria-label="Main navigation">${[['home','home','Home'],['saved','save','Saved'],['me','user','Me']].map(([r,i,n])=>`<button class="nav-item" data-screen="${r}" ${active===r?'aria-current="page"':''}>${icon(i)}${n}</button>`).join('')}</nav>`}
function row(i,label,action,sub=''){return `<button class="row" data-action="${action}">${icon(i)}<span class="row-label">${label}${sub?`<small>${sub}</small>`:''}</span>${icon('arrow','trailing')}</button>`}
let profileReferenceTab='Posts';
function profileReferenceAvatar(){return `<span class="profile-art" aria-hidden="true"><svg viewBox="0 0 80 80"><defs><linearGradient id="profile-sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#73b4af"/><stop offset="1" stop-color="#c2dc87"/></linearGradient></defs><path fill="url(#profile-sky)" d="M0 0h80v80H0z"/><path fill="#c0c744" d="M0 24 21 20 48 27 80 22v58H0z"/><path fill="#3d8d69" d="M0 29 34 24 57 31 80 28v21H0z"/><path fill="#8fb042" d="m0 39 35-5 45 7v39H0z"/><path fill="#c9be43" d="M23 80 39 35l7 1 9 44z"/><path d="m0 52 30-5M50 48l30 4M0 65l27-6M56 63l24 4" stroke="#749346" stroke-width="2"/><path d="m34 76 6-26 6 1 5 25" fill="#3c3023"/><path d="m36 38 7-7 8 9 1 24-20-2z" fill="#5d452c"/><path d="m36 41-5 16-4 1 5-19M49 40l7 16-3 2-8-14" fill="#513a28"/><circle cx="43" cy="28" r="5" fill="#ba8b50"/><path d="M38 28q-3-9 6-8 6 0 5 8l-4-2-2-4-2 5z" fill="#2d261e"/><path d="M54 30 59 78" stroke="#51412b" stroke-width="1.4"/><path d="M47 44 54 47" stroke="#d3af66" stroke-width="3" stroke-linecap="round"/></svg></span>`}
function profileReferenceGlyph(kind){const paths={highlights:'<path d="m10 18 8-8a4 4 0 0 1 6 6l-8 8H9v-7Z"/><path d="m10 18 5 5M5 5v5M2.5 7.5h5M24 2v4M22 4h4M7 26h16"/>',report:'<rect x="5" y="5" width="21" height="21" rx="5"/><path d="M11 20v-6M16 20V10M21 20v-8"/>',footprints:'<path d="M16 27S3 20 3 12a7 7 0 0 1 13-3 7 7 0 0 1 13 3c0 8-13 15-13 15Z"/><path d="M12 15h8M16 11v8"/>',settings:'<path d="m16 3 10 6v12l-10 6-10-6V9z"/><path d="M13 15h6M16 12v6"/>'};return `<svg viewBox="0 0 32 32" aria-hidden="true">${paths[kind]||paths.settings}</svg>`}
function profileReferenceDove(){return `<svg class="profile-empty-art" viewBox="0 0 82 60" aria-hidden="true"><path fill="currentColor" d="M4 8c12 11 25 9 39 13-7 5-19 8-27 3L7 16l21 8C16 24 10 22 4 19c3 9 16 18 30 15-8 5-14 4-24 2 7 8 17 13 30 10 9-2 12-11 15-20 2-8 7-9 12-6l-2 4c-3-2-5-1-7 4-4 16-10 25-27 24L8 48l21-2C13 39 7 28 4 8Z"/><circle cx="63" cy="20" r="1.7" fill="#050e17"/><path d="m68 23 8 2-8 2zM70 12l3 6 2-8zM76 15l-1 5 6-3z" fill="currentColor"/></svg>`}
function profileReferenceMemberEntry(){const valid=entitled(),p=PLANS[state.plan];let title='Ad-free Membership',sub='Enjoy more peace.',action='Go ad-free';if(valid){title=`${p.label} Member`;sub=state.status==='cancelled'?`Ends ${date(state.expiry)}`:`Renews ${date(state.expiry)}`;action='View'}return `<button class="profile-membership" data-action="membership"><span class="profile-member-icon">${icon('crown')}</span><span class="profile-member-copy"><strong>${title}</strong><small>${sub}</small></span><span class="profile-member-action">${action}${icon('arrow')}</span></button>`}
function renderMe(){const tab=profileReferenceTab;return `<section class="profile-reference"><div class="profile-status" aria-hidden="true"><span>12:30</span><span class="status-symbols"><span class="signal"><i></i><i></i><i></i><i></i></span><svg class="status-wifi" viewBox="0 0 20 16"><path d="M2 5q8-7 16 0M5 8q5-4 10 0M8 11q2-2 4 0"/><circle cx="10" cy="14" r=".8" fill="currentColor" stroke="none"/></svg><svg class="status-battery" viewBox="0 0 28 14"><rect x="1" y="1" width="23" height="12" rx="3"/><rect class="charge" x="3" y="3" width="16" height="8" rx="1.5"/><path d="M26 5v4"/></svg></span></div><div class="profile-notifications"><button class="profile-notify" data-action="notifications" aria-label="Notifications">${icon('bell')}</button></div><div class="profile-person">${profileReferenceAvatar()}<div class="profile-identity"><div class="profile-name"><h1>Aaliyah</h1><span class="profile-age">18 <b>♂</b></span></div><p class="profile-id">ID: 187263817263<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 5h8v8H5zM3 10H1V1h9v2"/></svg></p></div><span class="profile-chevron" aria-hidden="true">${icon('arrow')}</span></div><div class="profile-stats"><span><strong>155k</strong>Likes</span><span><strong>10k</strong>Mutuals</span><span><strong>95k</strong>Following</span><span><strong>95k</strong>Followers</span></div>${profileReferenceMemberEntry()}<div class="profile-shortcuts"><button class="profile-shortcut" data-profile-feature="Highlights">${profileReferenceGlyph('highlights')}<span>Highlights</span></button><button class="profile-shortcut" data-profile-feature="Report">${profileReferenceGlyph('report')}<span>Report</span></button><button class="profile-shortcut" data-profile-feature="Footprints">${profileReferenceGlyph('footprints')}<span>Footprints</span></button><button class="profile-shortcut" data-action="settings" aria-label="体验设置">${profileReferenceGlyph('settings')}<span>Settings</span></button></div><div class="profile-tabs" role="tablist" aria-label="Profile content">${['Posts','Recs','Likes','Favorites'].map(t=>`<button class="profile-tab" role="tab" aria-selected="${tab===t}" data-profile-tab="${t}">${t}</button>`).join('')}</div><div class="profile-empty" role="tabpanel" aria-label="${tab}">${profileReferenceDove()}<p>${tab==='Posts'?'No videos yet':tab==='Recs'?'No recommendations yet':tab==='Likes'?'No liked videos yet':'No favorites yet'}</p>${tab==='Posts'?'<button class="profile-publish" data-profile-feature="Publish"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="3" width="18" height="16" rx="4"/><path d="M8 6h4v10H8zM5 9h10v4H5z" fill="#ffbf39"/><path d="m14 1 1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg>Go to publish</button>':''}</div></section>${luminaBottomNav('me')}`}
const reflections=[['A moment of peace.','May you find a little stillness today,<br>and a little light along the way.'],['Good things take root.','May hope meet you where you are,<br>and grow quietly from there.'],['Let your heart be light.','May the small joys of today<br>stay with you for a little longer.']];
function blessingCard(scene=state.scene){const [title,copy]=reflections[scene%reflections.length];return `<article class="serif-card"><span class="mini-sun" aria-hidden="true"></span><h2>${title}</h2><p>${copy}</p><span class="card-caption">A BLESSING FOR TODAY</span></article>`}

function laurel(right=false){return `<svg class="laurel ${right?'right':''}" viewBox="0 0 30 84" aria-hidden="true"><path d="M19 82C10 59 11 30 21 3" stroke="currentColor" stroke-width="1.8" fill="none"/>${[[18,8,-25],[14,23,-35],[12,40,-35],[13,57,-30],[17,73,-25]].map(([x,y,r])=>`<ellipse cx="${x-5}" cy="${y}" rx="5" ry="8" fill="currentColor" transform="rotate(${r} ${x-5} ${y})"/><ellipse cx="${x+5}" cy="${y+7}" rx="5" ry="8" fill="currentColor" transform="rotate(35 ${x+5} ${y+7})"/>`).join('')}</svg>`}
function renderPaywall(){const p=PLANS[selected];return `<section class="screen paywall paywall-reference"><header class="topbar"><button class="icon-btn" data-action="close-paywall" aria-label="Close membership">${icon('close')}</button><button class="restore-top" data-action="restore">Restore purchases</button></header>${paywallEmblem()}<div class="laurel-title">${laurel()}<h1>Ad-free<br>Subscription</h1>${laurel(true)}</div><ul class="benefits"><li><span class="benefit-icon">${icon('check')}</span>Uninterrupted Experience</li><li><span class="benefit-icon">${icon('check')}</span>Focus on Prayer</li><li><span class="benefit-icon">${icon('check')}</span>Rewards Without Ads</li><li><span class="benefit-icon">${icon('check')}</span>Exclusive Event Benefits</li><li><span class="benefit-icon">${icon('check')}</span>Support developer &amp; community</li></ul><div class="paywall-bottom"><div class="plans" role="group" aria-label="Subscription plans">${planCard('weekly')}${planCard('monthly')}</div>${state.pending?`<div class="inline-status">${state.pending.kind==='pending'?'Your payment is still pending.':'We’re confirming your membership.'} You won’t need to pay again.</div>`:''}<div class="purchase-area"><button class="primary" aria-describedby="renewal-copy" data-action="${state.pending?'check-purchase':'subscribe'}" ${busy?'disabled':''}>${busy?'<span class="spinner"></span>':state.pending?'Check payment status':'Subscribe Now'}</button><p class="renewal-copy" id="renewal-copy">Auto-renews at ${p.price} / ${p.period}.<br>Cancel anytime in Google Play.</p></div><div class="quiet-footer"><button class="text-btn" data-action="terms">Terms of Use</button><span class="footer-divider" aria-hidden="true">|</span><button class="text-btn" data-action="privacy">Privacy Policy</button></div><div class="preview-footer"><button class="continue-free" data-action="close-paywall">Continue for free</button><button class="icon-btn preview-settings" data-action="settings" aria-label="体验设置">${icon('settings')}</button></div></div></section>`}
function renderMembership(){const p=PLANS[state.plan],valid=entitled(),statusText=state.status==='cancelled'?'Active until the end of this period':valid?'Membership active':'Not subscribed';return `<section class="screen member-center">${topbar('Membership',true)}<span class="eyebrow">YOUR EVERYDAY, UNINTERRUPTED</span><h1 class="page-title">A quieter space.<br>For you.</h1>${valid?`<div class="member-card"><span class="eyebrow">${icon('crown')} AD-FREE MEMBER</span><h2>${p.label} membership</h2><p class="member-price">${p.price} / ${p.period}</p><span class="state-pill"><span class="state-dot"></span>${statusText}</span><p class="member-date">${state.status==='cancelled'?'Your benefits continue until':'Next renewal:'} ${date(state.expiry)}</p></div><ul class="membership-benefits"><li>${icon('check')}No interstitial ads</li><li>${icon('check')}Rewards without watching ads</li><li>${icon('check')}All your membership activity benefits</li></ul>${state.status==='cancelled'?'<p class="notice">Your renewal is canceled. You can keep enjoying all your benefits until this period ends.</p>':''}`:`<div class="member-card expiry-card"><h2>${statusText}</h2><p>Choose a plan to enjoy more peace.</p></div>${state.pending?'<div class="inline-status">Your payment is being confirmed. Check the latest status or restore your purchase. You won’t be charged again.</div>':''}<ul class="membership-benefits"><li>${icon('shield')}No interstitial interruptions</li><li>${icon('gift')}Use rewards without watching ads</li></ul>`}<div class="action-stack">${valid?'<button class="primary" data-action="manage">Manage subscription</button>':state.pending?'<button class="primary" data-action="check-purchase">Check payment status</button>':'<button class="primary" data-action="resubscribe">Explore plans</button>'}<button class="secondary" data-action="restore">Restore purchases</button></div><p class="body-copy" style="font-size:11px;text-align:center;margin-top:19px">Subscriptions are managed in Google Play.<br>You’re always in control of your renewal.</p></section>`}
function render(){if(normalizeMembership())save();let screen=getScreen();if(screen==='paywall'&&entitled()){screen='membership';history.replaceState({},'',`${location.pathname}${location.search}#membership`)}app.classList.toggle('is-paywall',screen==='paywall');app.classList.toggle('is-profile',screen==='me');app.classList.toggle('is-home-reference',screen==='home');app.classList.toggle('is-member-center',screen==='membership');main.innerHTML=screen==='paywall'?renderPaywall():screen==='membership'?renderMembership():screen==='home'?renderHome():screen==='saved'?renderSaved():renderMe();document.title=screen==='paywall'?'Ad-free Membership':screen==='membership'?'Your Membership':screen==='home'?'Lumina · Today':screen==='me'?'Lumina · Me':'Saved Blessings';}
function openMembership(){origin=['me','home','saved'].includes(getScreen())?getScreen():origin;if(entitled())navigate('membership');else{selected=state.pending?.plan||'monthly';navigate('paywall')}}
function checkout(){if(busy||state.pending||entitled())return;const p=PLANS[selected];openSheet(`<div class="sheet"><div class="sheet-head"><h2>Google Play</h2><button class="icon-btn" data-action="close-sheet" aria-label="Cancel purchase">${icon('close')}</button></div><span class="demo-note">演示购买 · 不会真实扣费</span><div class="checkout-plan"><div>Ad-free Membership<small>${p.label} subscription</small></div><strong>${p.price}<small>per ${p.period}</small></strong></div><div class="billing-summary">Renews automatically at ${p.price} / ${p.period}. Cancel your subscription anytime in Google Play.</div><button class="primary" data-action="confirm-purchase">Subscribe · ${p.price}</button><button class="continue-free" data-action="close-sheet">Not now</button></div>`,'Google Play purchase preview')}
async function confirmPurchase(){if(busy)return;busy=true;const requestedPlan=selected;sheet.querySelectorAll('button').forEach(b=>b.disabled=true);sheet.querySelector('.primary').innerHTML='<span class="spinner"></span> Processing';await wait(750);closeSheet();const outcome=state.purchaseOutcome;if(outcome==='cancel'){busy=false;render();toast('Purchase canceled');return}if(outcome==='pending'||outcome==='verify_error'){state.pending={plan:requestedPlan,kind:outcome==='pending'?'pending':'confirming'};save();busy=false;navigate('paywall');toast(outcome==='pending'?'Payment pending':'Confirming your membership');return}setMembership('active',requestedPlan);busy=false;render();showSuccess('You’re now ad-free.','Your membership is ready. Enjoy more peace.')}
function showSuccess(title,description){openSheet(`<div class="sheet" style="padding-top:32px"><div class="premium-mark" style="margin-top:12px;color:#536d43;border-color:#c9d1b9">${icon('check')}</div><h2 style="text-align:center">${title}</h2><p style="text-align:center">${description}</p><div class="action-stack"><button class="primary" data-action="return-origin">Continue</button><button class="text-btn" data-action="show-center">View membership</button></div></div>`,'Membership confirmation')}
async function checkPurchase(){if(busy)return;busy=true;render();await wait(650);if(state.pending&&state.purchaseOutcome==='success'){const plan=state.pending.plan;setMembership('active',plan);busy=false;render();showSuccess('Your membership is ready.','Your benefits are now active.');return}busy=false;render();toast(state.pending?.kind==='pending'?'Payment is still pending. Try again later.':'We couldn’t confirm it yet. Please try again.');}
async function restore(){if(busy)return;if(['me','home','saved'].includes(getScreen()))origin=getScreen();busy=true;openSheet(`<div class="sheet" style="text-align:center;padding-top:45px"><span class="spinner"></span><h2 style="margin-top:25px">Restoring purchases</h2><p>Checking your Google Play purchases…</p></div>`,'Restoring purchases');await wait(850);busy=false;closeSheet();if(state.restoreOutcome==='network'){toast('Couldn’t connect. Please try again.');return}if(state.restoreOutcome==='none'){toast(entitled()?'Your membership is up to date.':'No active subscription found.');return}const plan=state.restoreOutcome==='weekly'?'weekly':'monthly';if(!entitled()||state.plan!==plan)setMembership('active',plan);render();showSuccess('Membership restored.','Your existing benefits are ready to enjoy.')}
function manage(){if(!entitled()){openMembership();return}const p=PLANS[state.plan];openSheet(`<div class="sheet"><div class="sheet-head"><h2>Manage subscription</h2><button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('close')}</button></div><span class="demo-note">Google Play 体验 · 仅改变原型状态</span><div class="checkout-plan"><div>Ad-free Membership<small>${p.label} subscription</small></div><strong>${p.price}<small>per ${p.period}</small></strong></div><p>${state.status==='cancelled'?`Your membership ends on ${date(state.expiry)}.`:`Your next renewal is ${date(state.expiry)}.`}</p><div class="action-stack"><button class="primary" data-action="${state.status==='cancelled'?'resume-renewal':'cancel-renewal'}">${state.status==='cancelled'?'Resume renewal':'Cancel renewal'}</button><button class="secondary" data-action="close-sheet">Done</button></div></div>`,'Manage subscription preview')}
function settings(){openSheet(`<div class="sheet"><div class="sheet-head"><h2>体验设置</h2><button class="icon-btn" data-action="close-sheet" aria-label="关闭体验设置">${icon('close')}</button></div><p class="settings-note">仅用于查看原型状态，付款、恢复购买及广告均为模拟。不会修改活动页数据。</p><label class="settings-field">用户状态<select id="preview-status">${[['free','免费 / 到期'],['active','有效续订会员'],['cancelled','取消续费但未到期']].map(([v,n])=>`<option value="${v}" ${state.status===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="settings-field">订阅套餐<select id="preview-role">${[['weekly','周订阅 · $1.99 / 周'],['monthly','月订阅 · $2.99 / 月']].map(([v,n])=>`<option value="${v}" ${state.plan===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="settings-field">购买结果<select id="preview-payment">${[['success','成功'],['cancel','取消'],['pending','付款待处理'],['verify_error','验单网络异常']].map(([v,n])=>`<option value="${v}" ${state.purchaseOutcome===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="settings-field">恢复购买结果<select id="preview-restore">${[['none','无有效订单 / 保持已有权益'],['weekly','恢复周订阅'],['monthly','恢复月订阅'],['network','网络异常']].map(([v,n])=>`<option value="${v}" ${state.restoreOutcome===v?'selected':''}>${n}</option>`).join('')}</select></label><div class="action-stack"><button class="primary" data-action="apply-settings">应用设置</button><button class="secondary" data-action="reset-preview">重置体验</button></div></div>`,'体验设置');}
function applySettings(){const plan=$('#preview-role').value,status=$('#preview-status').value;state.purchaseOutcome=$('#preview-payment').value;state.restoreOutcome=$('#preview-restore').value;if(status!==state.status||(status!=='free'&&plan!==state.plan))setMembership(status,plan);else{state.plan=plan;save()}closeSheet();if(getScreen()==='paywall'&&entitled())navigate('membership');else render();toast('体验设置已更新')}
function finishSave(){if(state.savedScenes.includes(state.scene)){toast('Already saved to your blessings.');return}state.savedScenes.push(state.scene);save();render();toast('Saved. A little light, whenever you need it.')}
function nextReflection(){state.scene=(state.scene+1)%reflections.length;save();render();window.scrollTo(0,0)}
function showAd(kind,callback){if(entitled()){callback();return}let remaining=3;adCallback=callback;openSheet(`<div class="ad-scene"><span class="ad-label">AD · SPONSORED</span><button class="icon-btn" data-action="cancel-ad" aria-label="Close advertisement">${icon('close')}</button><div class="ad-orb"></div><h2>A little room<br>to unwind.</h2><p>Make space for a quieter kind of day.</p><button class="primary" id="ad-continue" data-action="complete-ad" ${kind==='rewarded'?'disabled':''}>${kind==='rewarded'?'Continue in 3s':'Continue'}</button></div>`,'Advertisement preview');adCallback=callback;adKind=kind;if(kind==='rewarded'){adTimer=setInterval(()=>{remaining--;const b=$('#ad-continue');if(!b){clearInterval(adTimer);return}b.textContent=remaining>0?`Continue in ${remaining}s`:'Continue';b.disabled=remaining>0;if(remaining<=0)clearInterval(adTimer)},1000)}}
function info(kind){const text={terms:['Terms of Use','Your subscription renews automatically at the selected price and billing interval. Manage or cancel renewal in Google Play. Canceling renewal keeps your benefits until the current paid period ends.'],privacy:['Privacy Policy','This interactive preview stores only its experience settings on this device. It does not collect payment details or create a real subscription.'],preferences:['Reading preferences','Your reading preferences stay the same when you join or leave a membership.'],notifications:['Notifications','You’re in control of your notifications. Membership does not change these settings.'],support:['Here to help','Restore purchases to check an existing subscription. You can manage your subscription and payment method in Google Play.']}[kind];openSheet(`<div class="sheet"><div class="sheet-head"><h2>${text[0]}</h2><button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('close')}</button></div><p>${text[1]}</p><button class="secondary" data-action="close-sheet" style="margin-top:24px">Done</button></div>`,text[0])}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.profileTab){profileReferenceTab=b.dataset.profileTab;render();return}if(b.dataset.screen){navigate(b.dataset.screen);return}if(b.dataset.plan){selected=b.dataset.plan;render();return}const action=b.dataset.action;switch(action){case'home-prayer':case'home-videos':case'home-bible':navigate('home');{const sectionY=action==='home-prayer'?666:action==='home-videos'?960:1720;requestAnimationFrame(()=>window.scrollTo({top:document.querySelector('.home-feed-frame').getBoundingClientRect().top+window.scrollY+document.querySelector('.home-feed-frame').clientWidth*sectionY/390,behavior:'smooth'}))}break;case'home-calendar':openSheet(`<div class="sheet"><div class="sheet-head"><h2>Your week</h2><button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('close')}</button></div><p>One day at a time. Keep making space for what matters.</p><button class="secondary" data-action="close-sheet">Done</button></div>`,'Calendar');break;case'membership':openMembership();break;case'back':navigate(origin);break;case'close-paywall':navigate(origin);break;case'subscribe':checkout();break;case'confirm-purchase':confirmPurchase();break;case'close-sheet':closeSheet();break;case'return-origin':navigate(origin);break;case'show-center':navigate('membership');break;case'check-purchase':checkPurchase();break;case'restore':restore();break;case'manage':manage();break;case'cancel-renewal':state.status='cancelled';save();closeSheet();render();toast('Renewal canceled. Your benefits stay active.');break;case'resume-renewal':state.status='active';save();closeSheet();render();toast('Renewal resumed.');break;case'resubscribe':selected='monthly';navigate('paywall');break;case'settings':settings();break;case'apply-settings':applySettings();break;case'reset-preview':state=initial();save();selected='monthly';origin='me';closeSheet();navigate('me');toast('体验已重置');break;case'saved':navigate('saved');break;case'save-blessing':if(state.savedScenes.includes(state.scene))finishSave();else if(entitled())finishSave();else if(!b.querySelector('.ad-badge')){render();toast('Membership ended. Please check the updated action.')}else showAd('rewarded',finishSave);break;case'next-reflection':if(entitled())nextReflection();else showAd('interstitial',nextReflection);break;case'cancel-ad':{const cb=adKind==='interstitial'?adCallback:null;closeSheet();if(cb)cb();break}case'complete-ad':{const cb=adCallback;closeSheet();if(cb)cb();break}case'terms':case'privacy':case'preferences':case'notifications':case'support':info(action);break;}});
sheet.addEventListener('cancel',()=>{const cb=adKind==='interstitial'?adCallback:null;clearInterval(adTimer);adCallback=null;adKind=null;if(cb)cb()});
window.addEventListener('popstate',()=>{closeSheet();render()});window.addEventListener('focus',()=>{if(!sheet.open)render()});
setInterval(()=>{if(normalizeMembership()){save();if(!sheet.open)render()}},15000);
if(!location.hash){const requested=new URLSearchParams(location.search).get('screen');if(['me','home','paywall','membership','saved'].includes(requested))history.replaceState({},'',`${location.pathname}${location.search}#${requested}`)}render();
})();
</script>
</body></html>
